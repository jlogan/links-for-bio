services:
  linksforbio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linksforbio
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - linksforbio-network
    depends_on:
      - redis
    extra_hosts:
      - "linksforbio.local:127.0.0.1"

  redis:
    image: redis:alpine
    container_name: linksforbio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - linksforbio-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: linksforbio-meilisearch
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/data.ms
    networks:
      - linksforbio-network
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}

networks:
  linksforbio-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
